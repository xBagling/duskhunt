<!doctype html>
<html lang="en" data-time="0" data-dark="0">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dusk Hunt · the daily animal sound puzzle</title>
    <meta name="description" content="A free daily puzzle: hear today's mystery animal at 1/8 speed and guess it as the call speeds up. Every miss sets the sun a little lower. Find it before dark." />
    <link rel="canonical" href="https://xbagling.github.io/duskhunt/" />
    <meta name="theme-color" content="#6fb8e6" />
    <meta name="color-scheme" content="light" />
    <!-- Static hosts can't send headers, so the security policy is set here too (server.js sends it as a header). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://upload.wikimedia.org https://thumb.wikimedia.org; media-src 'self' https://upload.wikimedia.org; connect-src 'self' https://upload.wikimedia.org https://en.wikipedia.org https://commons.wikimedia.org; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Link previews (WhatsApp, iMessage, Discord, X, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dusk Hunt" />
    <meta property="og:title" content="Dusk Hunt · the daily animal sound puzzle" />
    <meta property="og:description" content="Hear today's animal at 1/8 speed. Every miss speeds it up and sets the sun lower. Find it before dark." />
    <meta property="og:url" content="https://xbagling.github.io/duskhunt/" />
    <meta property="og:image" content="https://xbagling.github.io/duskhunt/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dusk Hunt: a cut-paper landscape at sunset with an animal on the ridge" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Dusk Hunt",
        "url": "https://xbagling.github.io/duskhunt/",
        "image": "https://xbagling.github.io/duskhunt/og-image.png",
        "description": "A free daily puzzle: guess the mystery animal from its call, played at 1/8 speed and speeding up with every miss.",
        "genre": ["Puzzle", "Trivia"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Connect early: fonts, and Wikimedia (every call is streamed from there). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link rel="dns-prefetch" href="https://en.wikipedia.org" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&display=swap" rel="stylesheet" />
    <!-- The Noto emoji fallback is loaded by app.js, only on systems that need it. -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="modulepreload" href="js/animals.js" />
    <link rel="modulepreload" href="js/audio.js" />
    <link rel="modulepreload" href="js/components/celebrate.js" />
    <link rel="modulepreload" href="js/components/confetti.js" />
    <link rel="modulepreload" href="js/components/modeswitch.js" />
    <link rel="modulepreload" href="js/components/search.js" />
    <link rel="modulepreload" href="js/components/skychart.js" />
    <link rel="modulepreload" href="js/components/visualizer.js" />
    <link rel="modulepreload" href="js/config.js" />
    <link rel="modulepreload" href="js/data/animal-list.js" />
    <link rel="modulepreload" href="js/data/answers.js" />
    <link rel="modulepreload" href="js/data/schedule.js" />
    <link rel="modulepreload" href="js/data/sound-hosting.js" />
    <link rel="modulepreload" href="js/icons.js" />
    <link rel="modulepreload" href="js/loudness.js" />
    <link rel="modulepreload" href="js/puzzle.js" />
    <link rel="modulepreload" href="js/scene.js" />
    <link rel="modulepreload" href="js/sfx.js" />
    <link rel="modulepreload" href="js/stats.js" />
    <link rel="modulepreload" href="js/store.js" />
    <link rel="modulepreload" href="js/util.js" />
    <link rel="modulepreload" href="js/views/admin.js" />
    <link rel="modulepreload" href="js/views/archive.js" />
    <link rel="modulepreload" href="js/views/modals.js" />
    <link rel="modulepreload" href="js/views/play.js" />
    <link rel="modulepreload" href="js/views/results.js" />
  </head>
  <body data-scene="tall">
    <div class="scene" id="scene">
      <div class="scene-ui">
        <header class="topbar">
          <a class="logo" href="#/" aria-label="Dusk Hunt, today's animal"><span>Dusk Hunt</span></a>
          <nav class="nav" aria-label="Main">
            <button class="icon-btn" type="button" data-action="sfx" aria-label="Sound effects" title="Sound effects"></button>
            <a class="icon-btn" href="#/archive" aria-label="Past days" title="Past days"><svg class="i" aria-hidden="true"><use href="#i-journal"/></svg></a>
            <button class="icon-btn" type="button" data-action="stats" aria-label="Your logbook" title="Your logbook"><svg class="i" aria-hidden="true"><use href="#i-chart"/></svg></button>
            <button class="icon-btn" type="button" data-action="help" aria-label="How it works" title="How it works"><svg class="i" aria-hidden="true"><use href="#i-help"/></svg></button>
          </nav>
        </header>
        <div class="hero" id="hero"></div>
      </div>
      <div class="meter" id="meter" hidden></div>
      <div class="drop" id="drop" aria-hidden="true"></div>
      <div class="tag" id="tag" aria-hidden="true"></div>
      <div class="verdict" id="verdict" aria-live="assertive"></div>
    </div>
    <main class="ground-page" id="view" aria-live="polite">
      <noscript>
        <div class="wrap" style="padding:24px 16px">
          <h1>Dusk Hunt</h1>
          <p>A free daily animal sound puzzle. Every day there's one mystery animal. You hear its call slowed down to 1/8 speed, where even a mouse can sound like a whale. Every wrong guess speeds the sound up and moves the sun lower. Name the animal before it gets dark.</p>
          <p>Dusk Hunt needs JavaScript to play. Please turn it on and reload the page.</p>
        </div>
      </noscript>
    </main>
    <div id="modal-root"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
